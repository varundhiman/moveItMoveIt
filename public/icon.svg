<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Mobility Ring (9 to 5 dial indicator) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14" stroke-dasharray="6 8" />
  <path d="M 121 256 A 135 135 0 1 1 391 256" fill="none" stroke="url(#glowGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Mobility Routine 5 Dots along ring -->
  <circle cx="121" cy="256" r="10" fill="#10b981" />
  <circle cx="165" cy="165" r="10" fill="#06b6d4" />
  <circle cx="256" cy="121" r="12" fill="#38bdf8" />
  <circle cx="347" cy="165" r="10" fill="#6366f1" />
  <circle cx="391" cy="256" r="10" fill="#a855f7" />

  <!-- Center Dynamic Movement Figure -->
  <g transform="translate(136, 126) scale(0.95)" filter="url(#glow)">
    <!-- Head -->
    <circle cx="140" cy="50" r="24" fill="#ffffff" />
    <!-- Torso -->
    <path d="M 125 85 L 155 85 L 145 155 L 115 150 Z" fill="#ffffff" />
    <!-- Arms in dynamic power motion -->
    <path d="M 125 90 L 80 120 L 60 95" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 155 90 L 195 70 L 225 105" fill="none" stroke="#06b6d4" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Legs in deep athletic stride / squat ready -->
    <path d="M 120 150 L 85 190 L 65 240" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 145 155 L 180 195 L 210 240" fill="none" stroke="#6366f1" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Central pulse core -->
    <circle cx="135" cy="118" r="7" fill="#10b981" />
  </g>

  <!-- 9-to-5 Badge Pill at bottom -->
  <g transform="translate(186, 395)">
    <rect width="140" height="42" rx="21" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2" />
    <text x="70" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="1.5">9 — 5 MOVE</text>
  </g>
</svg>
