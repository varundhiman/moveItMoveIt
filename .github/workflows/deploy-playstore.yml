name: Deploy to Google Play Store & Netlify

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Install Bubblewrap CLI (Google Play PWA Engine)
        run: npm install -g @bubblewrap/cli

      - name: Decode Android Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore

      - name: Generate Android Project & Build App Bundle (.aab)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'movemates123' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'movemates123' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'movemates' }}
        run: |
          # Initialize Android project from twa-manifest.json
          bubblewrap init --manifest twa-manifest.json --directory ./android-app --skipPwaValidation
          
          # Build signed Android App Bundle (AAB) for Play Store
          cd android-app
          if [ -f "../android.keystore" ]; then
            bubblewrap build --signing.keyStore=../android.keystore --signing.keyStorePassword=$KEYSTORE_PASSWORD --signing.keyPassword=$KEY_PASSWORD --signing.keyAlias=$KEY_ALIAS
          else
            # Build without external keystore if not yet configured
            ./gradlew bundleRelease || ./gradlew assembleRelease
          fi
          cd ..

      - name: Archive Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: movemates-android-release
          path: |
            android-app/app/build/outputs/bundle/release/*.aab
            android-app/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload to Google Play Console
        if: env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v4
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.movemates.app
          releaseFiles: android-app/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
