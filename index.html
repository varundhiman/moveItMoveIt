<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MoveMates — 9-to-5 Mobility Challenge</title>
    <meta name="description" content="MoveMates: Workday fitness mobility challenge with friends. Track squats, pushups, jumping jacks, planks, and walks between 9 AM and 5 PM with AI camera rep tracking and live shared leaderboards." />
    
    <!-- OpenGraph & Twitter -->
    <meta property="og:title" content="MoveMates — 9-to-5 Mobility Challenge" />
    <meta property="og:description" content="MoveMates: Workday fitness mobility challenge with friends. Track squats, pushups, jumping jacks, planks, and walks between 9 AM and 5 PM with AI camera rep tracking and live shared leaderboards." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MoveMates — 9-to-5 Mobility Challenge" />
    <meta name="twitter:description" content="MoveMates: Workday fitness mobility challenge with friends. Track mobility routines between 9 AM and 5 PM with AI vision." />

    <!-- Mobile & PWA Requirements -->
    <meta name="theme-color" content="#0B0D13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MoveMates" />
    <meta name="application-name" content="MoveMates" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Google Fonts for athletic neo-brutalist typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- Auto-suppress Netlify floating badge / drawer -->
    <script>
      try {
        localStorage.setItem('nl-hud:public:v1', 'hidden');
        localStorage.setItem('netlify-badge-dismissed', 'true');
      } catch (e) {}

      (function() {
        function removeNetlifyBadge() {
          var items = document.querySelectorAll('iframe[src*="netlify"], div[data-netlify-deploy-id], [class*="netlify-badge"], [id*="netlify-badge"]');
          for (var i = 0; i < items.length; i++) {
            items[i].remove();
          }
        }
        if (typeof MutationObserver !== 'undefined') {
          var obs = new MutationObserver(removeNetlifyBadge);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
        document.addEventListener('DOMContentLoaded', removeNetlifyBadge);
        window.addEventListener('load', removeNetlifyBadge);
      })();
    </script>
  </head>
  <body class="bg-[#FAF7F0] text-neutral-900 antialiased selection:bg-amber-300 selection:text-neutral-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
